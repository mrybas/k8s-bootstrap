# Cert-Manager CRDs
# Hidden chart - auto-included when cert-manager is selected

id: cert-manager-crds
name: Cert-Manager CRDs
description: Custom Resource Definitions for cert-manager (Certificate, Issuer, ClusterIssuer, etc.)
category: crds
categoryName: CRDs
categoryDescription: Custom Resource Definitions
icon: "📋"
priority: 2
docsUrl: https://cert-manager.io/docs/

# Hidden from UI - auto-included when cert-manager is selected
hidden: true
autoInclude:
  when:
    - cert-manager

# CRDs-only: vendored chart at definitions/charts/cert-manager-crds/
# (mirrors gateway-api-crd). The repo_generator detects the bundled
# Chart.yaml and copytrees the dir into the workspace; Helm applies the
# CRDs in crds/. Pointing at the full jetstack chart with installCRDs:true
# (the old setup) deployed a SECOND cert-manager controller/webhook
# alongside the cert-manager component — this fixes that.
chartType: custom
namespace: o0-crds
releaseName: cert-manager-crds
createNamespace: false  # Created by repo_generator for all CRDs

version: "1.21.1"
appVersion: "v1.21.1"

# CRDs only — no controller, no values to set.
defaultValues: {}
