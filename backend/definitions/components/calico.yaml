# Calico CNI - Tenant Only
# Not used on host cluster (host uses Cilium/Kube-OVN).
# Deployed into tenant clusters via HelmRelease.

id: calico
name: Calico CNI
description: Pod networking and NetworkPolicy enforcement via Tigera Operator
category: networking
categoryName: Networking
categoryDescription: CNI, service mesh, and network policies
icon: "🔗"
priority: 200

# Tenant-only: hidden from host component selection
tenantOnly: true
hidden: true

chartType: upstream
namespace: tigera-operator
releaseName: calico
createNamespace: true

upstream:
  repository: https://docs.tigera.io/calico/charts
  chartName: tigera-operator
  # NOT v3.32.x: from Calico 3.32 the tigera-operator chart stopped shipping a
  # crds/ directory and keeps its CRDs as ordinary templates. Helm then builds
  # the manifest before those CRDs exist and the very first install fails with
  # 'no matches for kind "Installation"/"APIServer"/"Goldmane" in
  # operator.tigera.io/v1' — nothing is applied, so it can never self-heal.
  # 3.31.3 is the newest chart that still installs cleanly in one pass.
  version: "v3.31.3"

# --- Tenant Addon Configuration ---
tenantAddon: true
tenantConfig:
  order: 1
  namespace: tigera-operator
  discovery_type: ""
  required: true
  default: true
  defaultValues:
    tigera-operator:
      installation:
        calicoNetwork:
          bgp: Disabled
          ipPools:
            - cidr: "10.244.0.0/16"
              encapsulation: VXLAN
  parameters: []
