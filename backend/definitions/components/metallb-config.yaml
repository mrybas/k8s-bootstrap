# MetalLB Configuration
# IP address pools and L2/BGP advertisements
# Note: When using with Kube-OVN, add MetalLB IP ranges to Kube-OVN's excludeIps

id: metallb-config
name: MetalLB Configuration
description: Configure IP address pools and advertisements for MetalLB. Important - exclude these IPs from Kube-OVN IPAM
category: ingress
categoryName: Ingress
icon: "📋"
priority: 22
docsUrl: https://metallb.universe.tf/configuration/

# Requires metallb to be selected first
requiresOperator: metallb

chartType: custom
namespace: o0-metallb
releaseName: metallb-config
createNamespace: false

dependsOn:
  - metallb

defaultValues:
  ipAddressPools:
    - name: default
      addresses:
        - "192.168.1.240-192.168.1.250"
  l2Advertisements:
    - name: default
      ipAddressPools:
        - default
  bgpAdvertisements: []
  bgpPeers: []

jsonSchema:
  type: object
  properties:
    ipAddressPools:
      type: array
      title: IP Address Pools (Advanced)
      items:
        type: object
        required: [name, addresses]
        properties:
          name:
            type: string
            title: Pool Name
          addresses:
            type: array
            title: Address Ranges
            items:
              type: string
          autoAssign:
            type: boolean
            title: Auto Assign
            default: true
    l2Advertisements:
      type: array
      title: L2 Advertisements
      items:
        type: object
        properties:
          name:
            type: string
          ipAddressPools:
            type: array
            items:
              type: string
          interfaces:
            type: array
            title: Interfaces
            description: >-
              Announce only on these interfaces. Left empty MetalLB ARPs on
              every interface it can see, so a VIP that belongs on a transit
              bridge also answers on the management NIC.
            items:
              type: string
          nodeSelectors:
            type: array
            title: Node selectors
            description: >-
              Which nodes may announce this pool. Also the only supported way
              to move a VIP off a node: `kubectl drain` does not, because the
              speaker is a DaemonSet and the node stays up.
            items:
              type: object
    bgpPeers:
      type: array
      title: BGP Peers
      description: >-
        BGPPeer objects. BGP mode needs at least one; the chart previously had
        no way to express a peer at all, so it had to be applied by hand.
      items:
        type: object
        properties:
          name:
            type: string
          myASN:
            type: integer
          peerASN:
            type: integer
          peerAddress:
            type: string
          peerPort:
            type: integer
          sourceAddress:
            type: string
          nodeSelectors:
            type: array
            items:
              type: object
    bgpAdvertisements:
      type: array
      title: BGP Advertisements
      items:
        type: object
        properties:
          name:
            type: string
          ipAddressPools:
            type: array
            items:
              type: string
          peers:
            type: array
            items:
              type: string

uiSchema:
  ipAddressPools:
    items:
      addresses:
        ui:widget: array
        ui:placeholder: "192.168.1.240-192.168.1.250 or 192.168.1.0/24"
  l2Advertisements:
    ui:help: "Use for Layer 2 mode (ARP/NDP)"
  bgpPeers:
    ui:collapsed: true
    ui:help: "BGP mode: the peer(s) to talk to. Without one there is no session."
  bgpAdvertisements:
    ui:collapsed: true
    ui:help: "Use for BGP mode"

templates:
  ipaddresspools.yaml: |
    {{- range .Values.ipAddressPools }}
    ---
    apiVersion: metallb.io/v1beta1
    kind: IPAddressPool
    metadata:
      name: {{ .name }}
    spec:
      addresses:
        {{- range .addresses }}
        - {{ . }}
        {{- end }}
      {{- if hasKey . "autoAssign" }}
      autoAssign: {{ .autoAssign }}
      {{- end }}
    {{- end }}
  l2advertisements.yaml: |
    {{- range .Values.l2Advertisements }}
    ---
    apiVersion: metallb.io/v1beta1
    kind: L2Advertisement
    metadata:
      name: {{ .name }}
    spec:
      ipAddressPools:
        {{- range .ipAddressPools }}
        - {{ . }}
        {{- end }}
      {{- with .interfaces }}
      interfaces:
        {{- toYaml . | nindent 4 }}
      {{- end }}
      {{- with .nodeSelectors }}
      nodeSelectors:
        {{- toYaml . | nindent 4 }}
      {{- end }}
    {{- end }}
  bgppeers.yaml: |
    {{- range .Values.bgpPeers }}
    ---
    apiVersion: metallb.io/v1beta2
    kind: BGPPeer
    metadata:
      name: {{ .name }}
    spec:
      myASN: {{ .myASN }}
      peerASN: {{ .peerASN }}
      peerAddress: {{ .peerAddress }}
      {{- with .peerPort }}
      peerPort: {{ . }}
      {{- end }}
      {{- with .sourceAddress }}
      sourceAddress: {{ . }}
      {{- end }}
      {{- with .nodeSelectors }}
      nodeSelectors:
        {{- toYaml . | nindent 4 }}
      {{- end }}
    {{- end }}
  bgpadvertisements.yaml: |
    {{- range .Values.bgpAdvertisements }}
    ---
    apiVersion: metallb.io/v1beta1
    kind: BGPAdvertisement
    metadata:
      name: {{ .name }}
    spec:
      ipAddressPools:
        {{- range .ipAddressPools }}
        - {{ . }}
        {{- end }}
    {{- end }}
