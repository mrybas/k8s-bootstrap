# CDI StorageProfiles
#
# WHY THIS EXISTS
# CDI keeps one StorageProfile per StorageClass and uses it to fill in the
# accessMode/volumeMode of a DataVolume that does not state them. It can only
# populate that profile automatically for provisioners it recognises, and the
# match is on the *full* provisioner string. Rook derives the RBD/CephFS
# provisioner from the operator namespace, so a Rook deployed anywhere other
# than the upstream default `rook-ceph` produces a name CDI has never heard of:
#
#   provisioner: o0-rook-ceph.rbd.csi.ceph.com
#   status.conditions: Recognized=False (UnrecognizedProvisioner)
#   spec.claimPropertySets: <empty>
#
# An empty profile is harmless right up until something creates a DataVolume
# without an explicit accessMode — and the two consumers that matter both do:
#
#   * kubevirt-csi-driver, i.e. every PVC created inside a TENANT cluster whose
#     storage is passed through to this cluster's Ceph
#   * DataImportCrons / golden images and most `virtctl image-upload` flows
#
# Those DataVolumes then sit forever with:
#
#   ErrClaimNotValid: Spec is missing accessMode and volumeMode, cannot get
#   access mode from StorageProfile <sc>
#
# and, because the DataVolume never produces a PVC, the tenant-side PVC stays
# Pending / the pod never mounts. Nothing in Ceph is wrong, nothing is logged
# in the tenant, and the CephCluster is HEALTH_OK the whole time — which makes
# this one expensive to diagnose from the tenant end.
#
# So we set claimPropertySets explicitly. `spec` is the user-owned half of a
# StorageProfile (CDI only ever writes `status`), so patching it is supported
# and survives CDI upgrades. The Job patches rather than applies because the
# objects are created and owned by CDI — applying our own copy would fight the
# CDI controller over ownership.
#
# ORDERING: StorageProfiles only exist once CDI is running and has observed the
# StorageClasses, hence dependsOn kubevirt-cdi (which itself follows storage).
#
# RBD gets Block first: live migration needs RWX, and RWX is only safe on Block
# for RBD. CDI picks the first entry whose accessMode the StorageClass supports,
# so ordering here is the actual policy, not decoration.

id: cdi-storage-profiles
name: CDI Storage Profiles
description: Fills in accessMode/volumeMode defaults for StorageClasses whose provisioner CDI does not recognise (any Rook not in the default namespace)
category: virtualization
categoryName: Virtualization
categoryDescription: Virtual machines and container-native virtualization
icon: "🧩"
priority: 65
docsUrl: https://github.com/kubevirt/containerized-data-importer/blob/main/doc/storageprofile.md

chartType: custom
namespace: o0-kubevirt
releaseName: cdi-storage-profiles
createNamespace: false
timeout: 10m

dependsOn:
  - kubevirt-cdi

templates:
  rbac.yaml: |
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: {{ .Release.Name }}
      namespace: {{ .Release.Namespace }}
      annotations:
        "helm.sh/hook": post-install,post-upgrade
        "helm.sh/hook-weight": "0"
        "helm.sh/hook-delete-policy": before-hook-creation
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: {{ .Release.Name }}
      annotations:
        "helm.sh/hook": post-install,post-upgrade
        "helm.sh/hook-weight": "0"
        "helm.sh/hook-delete-policy": before-hook-creation
    rules:
      - apiGroups: ["cdi.kubevirt.io"]
        resources: ["storageprofiles"]
        verbs: ["get", "list", "watch", "patch", "update"]
      - apiGroups: ["storage.k8s.io"]
        resources: ["storageclasses"]
        verbs: ["get", "list", "watch"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: {{ .Release.Name }}
      annotations:
        "helm.sh/hook": post-install,post-upgrade
        "helm.sh/hook-weight": "0"
        "helm.sh/hook-delete-policy": before-hook-creation
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: {{ .Release.Name }}
    subjects:
      - kind: ServiceAccount
        name: {{ .Release.Name }}
        namespace: {{ .Release.Namespace }}

  patch-job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: {{ .Release.Name }}
      namespace: {{ .Release.Namespace }}
      annotations:
        "helm.sh/hook": post-install,post-upgrade
        "helm.sh/hook-weight": "10"
        "helm.sh/hook-delete-policy": before-hook-creation
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: {{ .Values.timeoutSeconds | default 600 }}
      template:
        metadata:
          name: {{ .Release.Name }}
        spec:
          serviceAccountName: {{ .Release.Name }}
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: patch
              image: {{ (.Values.image).repository | default "mirror.gcr.io/alpine/k8s" }}:{{ (.Values.image).tag | default "1.34.1" }}
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  DEADLINE=$(( $(date +%s) + {{ .Values.timeoutSeconds | default 600 }} - 60 ))
                  {{- range .Values.profiles }}

                  SC={{ .storageClass | quote }}
                  PATCH={{ dict "spec" (dict "claimPropertySets" .claimPropertySets "cloneStrategy" (.cloneStrategy | default "csi-clone")) | toJson | quote }}

                  # CDI creates the StorageProfile asynchronously once it sees
                  # the StorageClass; on a fresh cluster we can win that race.
                  while [ "$(date +%s)" -lt "$DEADLINE" ]; do
                    if kubectl get storageprofile "$SC" >/dev/null 2>&1; then
                      break
                    fi
                    if ! kubectl get storageclass "$SC" >/dev/null 2>&1; then
                      echo "  StorageClass $SC absent — skipping"
                      break
                    fi
                    echo "  waiting for StorageProfile $SC to appear"
                    sleep 5
                  done

                  if kubectl get storageprofile "$SC" >/dev/null 2>&1; then
                    kubectl patch storageprofile "$SC" --type merge -p "$PATCH"
                    echo "  patched StorageProfile $SC"
                  {{- if .required }}
                  else
                    echo "ERROR: required StorageProfile $SC never appeared" >&2
                    exit 1
                  {{- end }}
                  fi
                  {{- end }}

                  echo "CDI storage profiles reconciled"

defaultValues:
  image:
    repository: mirror.gcr.io/alpine/k8s
    tag: "1.34.1"
  timeoutSeconds: 600
  # Deployment-specific — the StorageClass names come from the Ceph pools this
  # deployment actually created. A profile whose StorageClass does not exist is
  # skipped unless `required: true`.
  profiles:
    - storageClass: ceph-block
      required: false
      # Block/RWX first: KubeVirt live migration needs RWX, and for RBD that is
      # only correct with volumeMode Block.
      claimPropertySets:
        - accessModes: ["ReadWriteMany"]
          volumeMode: Block
        - accessModes: ["ReadWriteOnce"]
          volumeMode: Block
        - accessModes: ["ReadWriteOnce"]
          volumeMode: Filesystem
      cloneStrategy: csi-clone
    - storageClass: ceph-filesystem
      required: false
      claimPropertySets:
        - accessModes: ["ReadWriteMany"]
          volumeMode: Filesystem
        - accessModes: ["ReadWriteOnce"]
          volumeMode: Filesystem
      cloneStrategy: csi-clone

jsonSchema:
  type: object
  properties:
    profiles:
      type: array
      title: Storage Profiles
      description: accessMode/volumeMode defaults applied to each StorageClass's CDI StorageProfile
      items:
        type: object
        properties:
          storageClass:
            type: string
            title: StorageClass
          required:
            type: boolean
            title: Required
            description: Fail the release if this StorageClass has no StorageProfile
            default: false
          cloneStrategy:
            type: string
            title: Clone Strategy
            enum:
              - copy
              - snapshot
              - csi-clone
            default: csi-clone
          claimPropertySets:
            type: array
            title: Claim Property Sets
            description: Ordered — CDI takes the first entry the StorageClass supports
            items:
              type: object
              properties:
                accessModes:
                  type: array
                  items:
                    type: string
                    enum:
                      - ReadWriteOnce
                      - ReadWriteMany
                      - ReadOnlyMany
                volumeMode:
                  type: string
                  enum:
                    - Block
                    - Filesystem
    timeoutSeconds:
      type: integer
      title: Wait Timeout (seconds)
      default: 600
      minimum: 60
    image:
      type: object
      title: Job Image
      properties:
        repository:
          type: string
          default: mirror.gcr.io/alpine/k8s
        tag:
          type: string
          default: "1.34.1"

uiSchema:
  image:
    ui:collapsed: true
