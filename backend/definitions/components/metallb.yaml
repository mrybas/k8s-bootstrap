id: metallb
name: MetalLB
description: Load balancer for bare-metal Kubernetes clusters
category: ingress
categoryName: Ingress
categoryDescription: Ingress controllers and load balancers
icon: ⚖️
priority: 21
docsUrl: https://metallb.universe.tf/

# metallb-config is auto-included when metallb is selected

chartType: upstream
namespace: o0-metallb
releaseName: metallb
createNamespace: true
podSecurityEnforce: privileged  # Required for speaker (hostNetwork, NET_RAW)
upstream:
  repository: https://metallb.github.io/metallb
  chartName: metallb
  version: 0.16.1
defaultValues:
  controller:
    enabled: true
    image:
      repository: quay.io/metallb/controller
      tag: null
      pullPolicy: null
    serviceAccount:
      create: true
      name: ''
      annotations: {}
  speaker:
    enabled: true
    # `speaker.frr` is deliberately absent. In MetalLB 0.16.1 it is mutually
    # exclusive with the frr-k8s deployment the chart now ships:
    #
    #   speaker.frr.enabled and frrk8s.enabled / external are mutually exclusive!
    #
    # The chart then refuses to render, and because everything downstream
    # depends on MetalLB the failure cascades — eight kustomizations went red
    # from this one toggle on the lab. BGP mode comes from frr-k8s, not here.
    image:
      repository: quay.io/metallb/speaker
      tag: null
      pullPolicy: null
    serviceAccount:
      create: true
      name: ''
      annotations: {}
    tolerateMaster: true
jsonSchema:
  type: object
  properties:
    controller:
      type: object
      title: Controller
      properties:
        enabled:
          type: boolean
          default: true
    speaker:
      type: object
      title: Speaker
      properties:
        enabled:
          type: boolean
          default: true
uiSchema: {}
