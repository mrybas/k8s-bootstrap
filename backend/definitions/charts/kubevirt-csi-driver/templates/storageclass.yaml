{{- /*
  StorageClass(es) — one per entry in .Values.storageClasses.
  Source: kubevirt/csi-driver deploy/tenant/base/deploy.yaml
*/}}
{{- range .Values.storageClasses }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .name }}
  labels:
    app: kubevirt-csi-driver
  {{- if .isDefault }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  {{- end }}
provisioner: csi.kubevirt.io
{{- /* PVC resize: the backing infra DataVolume / PVC must also live on an
       expandable host StorageClass for this to take effect. Defaults true
       to match the proven-working manifest; opt out per-SC with
       allowVolumeExpansion: false. hasKey (not `default`) so an explicit
       false isn't swallowed by Helm's empty-coalescing default. */}}
{{- if hasKey . "allowVolumeExpansion" }}
allowVolumeExpansion: {{ .allowVolumeExpansion }}
{{- else }}
allowVolumeExpansion: true
{{- end }}
parameters:
  infraStorageClassName: {{ .infraStorageClassName | default "" | quote }}
  bus: {{ .bus | default "scsi" | quote }}
{{- end }}
